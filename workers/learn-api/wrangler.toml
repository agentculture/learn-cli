# wrangler config for the learn API Worker.
#
# This is the thin, Cloudflare-native dynamic layer behind agentculture.org/learn
# (spec decision c22): auth sessions, the learner ledger, and the tutoring
# broker. The static site + signed-out tour are served by Cloudflare Pages and
# never invoke this Worker.
#
# Placeholders below (ids marked REPLACE_ME) are filled in by the operator at
# provisioning time — see README.md. Nothing secret lives in this file; secrets
# are set with `wrangler secret put` (also in README.md).

name = "learn-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
# Node-compat is not required — the Worker uses only Web-standard APIs
# (fetch, Request/Response, crypto.subtle, btoa/atob). Keep the bundle lean.

# --- Zone route (the same-origin /learn mount) -------------------------------
# Cloudflare Pages cannot be mounted at a path, so this ONE worker owns
# agentculture.org/learn/*: /learn/api/* is handled here, everything else
# proxies to PAGES_ORIGIN (which serves the site under /learn/ too).
#
# GOTCHA: `routes` is a TOP-LEVEL key and MUST appear ABOVE the [vars] table.
# Placed after [vars], TOML scopes it as `vars.routes` and wrangler silently
# ignores it ("No targets deployed") — the worker uploads but binds no route.
# This block is live in production (deployed 2026-07-11); the signed-out mount
# is served by exactly these two patterns.
routes = [
  { pattern = "agentculture.org/learn/*", zone_name = "agentculture.org" },
  { pattern = "agentculture.org/learn", zone_name = "agentculture.org" },
]

# --- Non-secret vars -------------------------------------------------------
# INFERENCE_URL points at a plain HTTPS inference endpoint the broker POSTs
# JSON to — NEVER a bespoke provider SDK. Leave it unset to disable tutoring
# (broker 503s). The production target is Bedrock-direct (t15, below).
[vars]
# GITHUB_CLIENT_ID (the OAuth/GitHub-App client id) is technically public but
# deliberately NOT committed here: like GITHUB_CLIENT_SECRET it is set via
# `wrangler secret put GITHUB_CLIENT_ID`, sourced from the repo-root .env
# (GITHUB_APP_CLIENT_ID). Out of [vars], a plain `wrangler deploy` never
# overwrites it and no environment-specific id is hardcoded in the repo.
PUBLIC_URL   = "https://agentculture.org"          # origin used to build the OAuth callback
APP_URL      = "https://agentculture.org/learn/"   # where the web callback redirects post-login
CORS_ORIGIN  = "https://agentculture.org"          # allow the /learn site to call the API with creds
PAGES_ORIGIN = "https://agentculture-learn.pages.dev"  # static-site origin the /learn zone mount proxies to

# Tutoring inference (t15, spec c24/h11) — Bedrock-direct, CONFIG ONLY (the
# broker code is untouched; see test/tutor-converse.test.js):
#   model:   us.amazon.nova-pro-v1:0   (Nova Pro, cross-region inference profile)
#   region:  us-east-1
#   INFERENCE_TOKEN: a Bedrock API key — set with
#     `wrangler secret put INFERENCE_TOKEN`, sourced from the repo-root .env
#     (AWS_BEDROCK_API_KEY_SECRET). Never committed, never a [vars] entry.
#   cost-when-busy: per-token Nova Pro spend ONLY — no model host, no
#     provisioned throughput, zero idle cost.
# Probe record (2026-07-11, live): Bedrock's OpenAI-compatible chat-completions
# surface does NOT serve Nova Pro in any probed region (model_not_found in
# us-east-1 / us-west-2 / eu-west-1 / eu-central-1; /openai/v1/models is not
# even an operation) — the native Converse API below is the live-verified
# target (HTTP 200, real completions, ~0.5-1s round trip). Payloads are
# Converse-shaped: {system:[{text}], messages:[{role, content:[{text}]}],
# inferenceConfig:{maxTokens, temperature}}; responses
# {output:{message:{content:[{text}]}}, stopReason, usage}. Converse tolerates
# the broker's `learner` stamp as an extra top-level field (also
# live-verified), so the forward stays verbatim. Uncomment to enable tutoring
# (t17's launch gate drives the live flip):
# INFERENCE_URL = "https://bedrock-runtime.us-east-1.amazonaws.com/model/us.amazon.nova-pro-v1:0/converse"

# ADMIN_GITHUB_IDS (spec c12/h4, task t8): comma-separated GitHub NUMERIC ids
# allow-listed for the admin surface (GET /api/admin/learners today; the
# approve/revoke surface, t9, reuses the same allow-list). Non-secret — a
# GitHub numeric id is not a credential — but enforcement is SERVER-SIDE
# ONLY: src/admin.js#isAdmin reads this var fresh on every admin request and
# never trusts a client-supplied admin claim (see that module's own header
# comment). Production admin: 20955789 (OriNachum, per the spec's audience).
ADMIN_GITHUB_IDS = "20955789"

# --- Voice bridge (task t16; deployed later under supervision) ---------------
# VOICE_BRIDGE_URL is the API Gateway WebSocket endpoint the SAM stack
# (infra/template.yaml) outputs after `sam deploy` — leave it unset until the
# bridge exists (POST /api/voice/token 503s not_configured meanwhile, same
# posture as INFERENCE_URL). VOICE_MAX_SESSION_SECONDS must equal the stack's
# MaxSessionSeconds parameter (default 300); VOICE_MONTHLY_SECONDS_CAP is the
# per-learner monthly allowance of MINTED session-seconds (default 1800 =
# 30 min — sizing rationale against the $20 Budgets ceiling in src/voice.js).
# VOICE_BRIDGE_URL          = "wss://<api-id>.execute-api.us-east-1.amazonaws.com/prod"
# VOICE_MAX_SESSION_SECONDS = "300"   # optional; defaults to 300 in src/voice.js
# VOICE_MONTHLY_SECONDS_CAP = "1800"  # optional; defaults to 1800 in src/voice.js

# --- Secrets (NEVER committed) ---------------------------------------------
# Set with: wrangler secret put <NAME>
#   SESSION_SECRET        random >=32 bytes; signs session tokens (HMAC-SHA256)
#   GITHUB_CLIENT_ID      the GitHub-App client id (.env GITHUB_APP_CLIENT_ID)
#   GITHUB_CLIENT_SECRET  from the GitHub OAuth app
#   INFERENCE_TOKEN       Bedrock API key (t15 — .env AWS_BEDROCK_API_KEY_SECRET)
#   VOICE_TOKEN_SECRET    signs voice tokens (t16); MUST equal the SAM stack's
#                         VoiceTokenSecretValue parameter — the bridge verifies
#                         with the same shared secret (infra/voice_bridge/tokens.py)

# --- KV: sessions namespace -------------------------------------------------
# Holds device-flow bookkeeping and session-revocation tombstones. Sessions
# themselves are stateless signed tokens; KV is only for revocation + device
# codes. Create with: wrangler kv namespace create SESSIONS
[[kv_namespaces]]
binding = "SESSIONS"
id = "9b32092755154bb5a1a72e1b92102254"
preview_id = "11ce3873085a4cee89fb791e0be901ab"

# --- D1: learner ledger -----------------------------------------------------
# learners (id, display_name, state) + records (append-only recorded results).
# Create with: wrangler d1 create learn-ledger
# Init schema:  wrangler d1 execute learn-ledger --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "learn-ledger"
database_id = "c32b7bf6-b0a8-4c22-86f7-b50b3aa22a2e"

# --- Observability ----------------------------------------------------------
[observability]
enabled = true

# --- Preview environment (task t1) ------------------------------------------
# A separate, non-production Worker + D1 so a `workflow_dispatch` deploy from
# ANY branch can prove the deploy pipeline green without ever touching prod.
# Cloudflare env bindings do NOT inherit from the top-level config, so every
# binding the preview Worker needs is repeated below. Deliberately NO
# `routes`/`route` key here: the production `/learn/*` zone route stays owned
# by the top-level Worker above, and a preview env must never bind it. Deploy
# with `wrangler versions upload --env preview` (a preview-only, non-promoting
# upload) — never `wrangler deploy --env preview`.
[env.preview]
name = "learn-api-preview"

# --- Preview vars ------------------------------------------------------------
# Mirrors the top-level [vars] block so the preview Worker is functional.
# INFERENCE_URL stays commented, exactly like top-level, until tutoring is
# wired up for this environment too.
[env.preview.vars]
PUBLIC_URL   = "https://agentculture.org"          # origin used to build the OAuth callback
APP_URL      = "https://agentculture.org/learn/"   # where the web callback redirects post-login
CORS_ORIGIN  = "https://agentculture.org"          # allow the /learn site to call the API with creds
PAGES_ORIGIN = "https://agentculture-learn.pages.dev"  # static-site origin the /learn zone mount proxies to
# INFERENCE_URL = "https://bedrock-runtime.us-east-1.amazonaws.com/model/us.amazon.nova-pro-v1:0/converse"
ADMIN_GITHUB_IDS = "20955789"

# --- Preview KV: sessions namespace ------------------------------------------
# A dedicated preview KV namespace (not the prod one) for cleaner isolation —
# a preview run's device-flow bookkeeping and revocation tombstones never mix
# with production session state. Create with:
#   wrangler kv namespace create SESSIONS_PREVIEW
# then replace the placeholder id below with the id that command prints.
[[env.preview.kv_namespaces]]
binding = "SESSIONS"
id = "PLACEHOLDER_PREVIEW_KV_ID"

# --- Preview D1: learner ledger ----------------------------------------------
# Own preview database, provisioned once by the operator:
#   wrangler d1 create learn-ledger-preview
#   wrangler d1 execute learn-ledger-preview --file schema.sql
# then replace the placeholder database_id below with the id that command
# prints (mirrors how the production database_id above is a real, filled-in
# value).
[[env.preview.d1_databases]]
binding = "DB"
database_name = "learn-ledger-preview"
database_id = "PLACEHOLDER_PREVIEW_D1_ID"
